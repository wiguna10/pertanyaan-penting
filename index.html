<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    color:#c0392b;
    margin-bottom:30px;
    font-size:45px;
}

.buttons{
    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;
    margin-bottom:30px;
}

button{
    border:none;
    border-radius:10px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    transition:0.3s;
}

#yesBtn{
    background:#00c16e;
    font-size:24px;
    padding:15px 35px;
}

#noBtn{
    background:#ff4d4d;
    font-size:20px;
    padding:15px 25px;
}

.cat{
    width:250px;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>DO YOU LOVE ME?</h1>

<div class="buttons">
    <button id="yesBtn">YES</button>
    <button id="noBtn">NO</button>
</div>

<img
class="cat"
src="cat.webp"
alt="cat">

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

let clickCount = 0;

const texts = [
    "NO",
    "Are you sure?",
    "Really?",
    "Think again!",
    "Please...",
    "Don't do this 😢",
    "Last chance!",
    "Why? 😭",
    "Stop clicking!",
    "Ok fine, I am telling you to STOP..."
];

noBtn.addEventListener("click", () => {

    clickCount++;

    let size = 24 + (clickCount * 18);

    yesBtn.style.fontSize = size + "px";
    yesBtn.style.padding =
        (15 + clickCount * 6) + "px " +
        (35 + clickCount * 20) + "px";

    let noSize = 20 - clickCount;

    if(noSize > 8){
        noBtn.style.fontSize = noSize + "px";
    }

    if(clickCount < texts.length){
        noBtn.innerText = texts[clickCount];
    }else{
        noBtn.innerText = texts[texts.length - 1];
    }

});

yesBtn.addEventListener("click", () => {

    document.body.innerHTML = `
        <div style="text-align:center">
            <h1 style="color:#00c16e">
                ❤️ I LOVE YOU TOO ❤️
            </h1>

            <img
            src="p1.webp"
            width="300">

            <h2 style="margin-top:20px">
                😍
            </h2>
        </div>
    `;

});

</script>

</body>
</html>
