<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Do You Love Me?</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4,
        #fad0c4,
        #fbc2eb
    );
    overflow:hidden;
}

.card{
    width:90%;
    max-width:600px;
    text-align:center;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.2);

    padding:40px;
    border-radius:30px;

    box-shadow:0 15px 40px rgba(0,0,0,.15);

    animation:fadeUp .8s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    color:white;
    font-size:40px;
    margin-bottom:20px;
    text-shadow:0 3px 10px rgba(0,0,0,.2);
}

.cat{
    width:220px;
    margin:20px auto;
    display:block;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:20px;
}

button{
    border:none;
    cursor:pointer;
    color:white;
    font-weight:600;
    transition:.3s;
}

#yesBtn{
    background:#00c26e;
    padding:15px 35px;
    font-size:22px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,194,110,.4);
}

#yesBtn:hover{
    transform:translateY(-3px);
}

#noBtn{
    background:#ff4d6d;
    padding:15px 35px;
    font-size:18px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(255,77,109,.4);
}

.result{
    color:white;
    font-size:40px;
    font-weight:700;
}

.subtitle{
    color:white;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="card" id="card">

    <h1>DO YOU LOVE ME? ❤️</h1>

    <img
    class="cat"
    id="cat"
    src="cat.webp">

    <div class="buttons">

        <button id="yesBtn">
            YES
        </button>

        <button id="noBtn">
            NO
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const card = document.getElementById("card");

let count = 0;

const noTexts = [
"NO",
"Are you sure?",
"Really?",
"Think again!",
"Please 😢",
"Don't do this 😭",
"Last chance!",
"Seriously?",
"Why??",
"Stop clicking 😤",
"Ok fine, I am telling you to STOP..."
];

noBtn.addEventListener("click",()=>{

count++;

yesBtn.style.fontSize = (22 + count*8) + "px";

yesBtn.style.padding =
(15 + count*3) + "px " +
(35 + count*10) + "px";

let noSize = 18 - count;

if(noSize > 8){
noBtn.style.fontSize = noSize + "px";
}

if(count < noTexts.length){
noBtn.innerText = noTexts[count];
}else{
noBtn.innerText = noTexts[noTexts.length-1];
}

});

yesBtn.addEventListener("click",()=>{

confetti({
particleCount:250,
spread:120,
origin:{y:0.6}
});

card.innerHTML = `

<div class="result">
❤️ I LOVE YOU TOO ❤️
</div>

<img
class="cat"
src="p1.webp">

<p class="subtitle">
You made my day 🥰
</p>

`;

});

</script>

</body>
</html>
